<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="author" content="Hans Soni">
  <title>404 — Page Not Found | Hans Soni</title>
  <meta name="description" content="This page could not be found. Return to Hans Soni's cybersecurity and software engineering portfolio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23090b0f'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='monospace' font-size='30' font-weight='700' fill='%23b7ff32'%3EHS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./custom.css">
  <style>
    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .error-card {
      width: min(100%, 720px);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid color-mix(in oklab, var(--neon-cyan) 28%, transparent);
      background: color-mix(in oklab, var(--background) 78%, transparent);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      backdrop-filter: blur(18px);
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .error-actions > a {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="relative min-h-screen">
    <canvas id="matrix-canvas" aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 opacity-40"></canvas>
    <div aria-hidden="true" class="scanlines pointer-events-none fixed inset-0 -z-10"></div>
    <div id="scroll-progress" aria-hidden="true" class="fixed inset-x-0 top-0 z-50 h-1 origin-left" style="transform: scaleX(0); background: var(--gradient-neon)"></div>

    <nav aria-label="Primary navigation" class="glass fixed left-1/2 top-4 z-40 -translate-x-1/2 rounded-full px-4 py-2 font-mono text-xs sm:text-sm">
      <a href="/" class="rounded-full px-3 py-1.5 text-muted-foreground transition hover:bg-primary hover:text-primary-foreground">hans-soni.github.io</a>
    </nav>

    <main class="relative mx-auto flex min-h-screen max-w-6xl items-center justify-center px-6 py-24 text-center">
      <section class="error-card reveal rounded-3xl">
        <p class="font-mono text-neon-lime"><span class="text-muted-foreground">root@hans:~$</span> locate page</p>
        <h1 class="animate-glitch mt-6 text-8xl font-bold leading-none tracking-tighter text-neon">404</h1>
        <h2 class="mt-8 text-3xl font-bold md:text-4xl">Page not found.</h2>
        <p class="mx-auto mt-4 max-w-lg text-muted-foreground">The page you’re looking for may have moved or no longer exists. Let’s get you back to something secure.</p>
        <div class="error-actions mt-8">
          <a href="/" class="inline-flex items-center gap-2 rounded-full bg-primary px-6 py-3 font-semibold text-primary-foreground shadow-[0_0_30px_var(--neon-lime)] transition hover:scale-105">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"></path><path d="M5 9v12h14V9"></path><path d="M9 21v-7h6v7"></path></svg>
            Back to portfolio
          </a>
          <a href="/#contact" class="glass inline-flex items-center gap-2 rounded-full px-6 py-3 font-semibold transition hover:scale-105">
            Contact Hans <span aria-hidden="true">↗</span>
          </a>
        </div>
        <p class="mt-10 font-mono text-xs text-muted-foreground">HTTP 404 · route not found</p>
      </section>
    </main>

    <div id="custom-cursor" aria-hidden="true" class="pointer-events-none fixed left-0 top-0 z-50 -ml-4 -mt-4 hidden h-8 w-8 rounded-full border-2 border-neon-pink mix-blend-screen md:block"></div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
